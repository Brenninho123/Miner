name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install watchdog requests psutil pytest pyinstaller

      - name: Run tests
        run: pytest

      - name: Run scanner smoke test
        run: python src/main.py scan data/signatures.json

      - name: Build executable
        run: pyinstaller --onefile --name miner-scan src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-scan-windows-py${{ matrix.python-version }}
          path: dist/miner-scan.exe
